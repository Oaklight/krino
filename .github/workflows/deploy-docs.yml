name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs_en/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: pip install -r docs_en/requirements.txt

      - name: Build docs
        run: mkdocs build -f docs_en/mkdocs.yml
        working-directory: .

      - name: Deploy to jev-explore-site
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: Oaklight/jev-explore-site
          publish_branch: main
          publish_dir: docs_en/site
