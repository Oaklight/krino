name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install --no-deps -e . && pip install pytest pytest-asyncio

      # A syntax error is invisible to the tests below when the file is only
      # imported behind pytest.importorskip("torch"): the skip happens before
      # the import, so an unparseable trainer passed this lane while the one
      # job that imports it runs 3.12, which accepts syntax newer than the
      # declared floor. py_compile parses every tracked module without
      # importing anything, so this catches that class in seconds and needs no
      # dependencies. It checks syntax only, not import-time errors, so it
      # does not make the torch lane redundant.
      - name: Parse every tracked module on this interpreter
        run: git ls-files '*.py' | xargs -r python -m py_compile

      - name: Run tests
        run: pytest tests/ -v

  # Eighteen test files call pytest.importorskip("torch") and therefore
  # never ran: the job above has no torch, so they counted as skips. That is the
  # hole a merge bug would hide in -- the LoRA merge is checked by exactly these
  # tests. This job installs the CPU wheel and runs those files.
  test-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --no-deps -e .
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest pytest-asyncio transformers

      - name: Run the torch-dependent tests
        run: pytest $(grep -rl 'importorskip("torch")' tests/) -v -m "not feature_guard"

      # Each marked test is re-run with the kill switch for the feature it
      # guards set, and must fail.  The marked subset is small, so this costs
      # seconds rather than another full suite.
      - name: Mutation-check guarded masks and exclusions
        run: pytest tests/ -m feature_guard -v

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Transform results
        run: python scripts/transform_results.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        run: cd web && npm ci && npm run build
