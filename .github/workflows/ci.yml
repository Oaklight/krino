name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install --no-deps -e . && pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

  # Eleven test files start with pytest.importorskip("torch") and therefore
  # never ran: the job above has no torch, so they counted as skips. That is the
  # hole a merge bug would hide in -- the LoRA merge is checked by exactly these
  # tests. This job installs the CPU wheel and runs those files.
  test-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --no-deps -e .
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest pytest-asyncio transformers

      - name: Run the torch-dependent tests
        run: pytest $(grep -rl 'importorskip("torch")' tests/) -v

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Transform results
        run: python scripts/transform_results.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        run: cd web && npm ci && npm run build
