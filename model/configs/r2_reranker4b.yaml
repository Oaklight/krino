# Round 2: Reranker-4B — full dataset, optimal config from all experiments
#
# Findings applied:
#   - Rank: r128 (head-size sweep, 45 runs)
#   - MLP: mlp=1, mlp_lr=3e-5 (MLP+LR targeted runs, +3.3pp over mlp=0)
#   - LR: 3e-4 uniform (MTL optimization, 12 runs — baseline wins)
#   - Attention: SDPA auto-detect (PR #94)
#   - Data: 26 benchmarks + 154K synthetic (23 domains)
#   - Shared attention: TBD (pending #98 verification)
#
# Usage:
#   python model/scripts/train_multitask.py --config model/configs/r2_reranker4b.yaml

model: Qwen/Qwen3-Reranker-4B
encoder: false
rank: 128
mlp_layers: 1
noul_rank: 128
mlp_lr: 3e-5
epochs: 20
lr: 0.0003
accumulation_steps: 8
eval_every: 1
seed: 42
save_every_epoch: true
shared_attention: true

sources:
