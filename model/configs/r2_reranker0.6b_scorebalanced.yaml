# Round 2 variant: score-balanced mixture (experiment, pending validation)
#
# Score is the least-supplied primitive. Every type gets 5,000 slots per
# epoch, but the pools behind them differ: 21,544 score items against 88,830
# noul, so each score item is drawn 3.8x as often as a noul item.  (The
# sampler holds type_ratios at 1:1:1 over a fixed epoch_size, so the
# resampling rate follows the pool, not the ratio.  An earlier revision of
# this header quoted the 27,235 / 111,708 pool sizes as per-epoch counts and
# called the ratio 4x; both were wrong.)
#
# This config raises the two score caps that were the binding constraint:
#   yelp      max_train  5,000 -> 20,000  (the prepared yelp.jsonl holds only
#                                         20,000 train rows; raising that
#                                         needs re-materialising the file)
#   synthetic max_train 10,000 -> 30,000  (measured: 4,231 score items at this
#                                         cap; all 19,854 train score items
#                                         would need max_train ~138,595)
# Everything else is identical to r2_reranker0.6b.yaml, so a run against the
# 49.11 frozen baseline isolates the mixture change.
#
# Usage:
#   python model/scripts/train_multitask.py \
#       --config model/configs/r2_reranker0.6b_scorebalanced.yaml
#
# Findings applied:
#   - Rank: r64 (head-size sweep — higher rank hurts for 0.6B)
#   - MLP: mlp=0 (MLP+LR targeted runs — MLP doesn't help for small backbone)
#   - LR: 1e-3 uniform (MTL optimization — baseline wins)
#   - Attention: SDPA auto-detect (PR #94)
#   - Data: 26 benchmarks + 154K synthetic (23 domains)
#   - Shared attention: TBD (pending #98 verification)
#
# Usage:
#   python model/scripts/train_multitask.py --config model/configs/r2_reranker0.6b.yaml

model: Qwen/Qwen3-Reranker-0.6B
encoder: false
rank: 64
epochs: 20
lr: 0.001
accumulation_steps: 8
eval_every: 1
seed: 42
save_every_epoch: true
shared_attention: true

