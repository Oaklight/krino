# Round 2 variant: widened choice caps (experiment)
#
# Choice is the weakest primitive and the best-supplied. At 8B full LoRA the
# per-type accuracies were noul 0.776, choice 0.392, score 0.321, and choice is
# 51% of the eval set, so overall accuracy is dominated by it. The pool report
# shows choice at only ~0.07x resampling -- 71,888 items available against
# 5,000 slots per epoch -- while the underlying sources hold far more (agnews
# 120,000 train, mmlu 99,842, race 87,866, swag 73,546).
#
# This config raises max_train on the large choice sources. epoch_size is
# unchanged, so the sampler still draws 5,000 items per type per epoch.
#
# WHAT THIS ARM ACTUALLY VARIES — read before interpreting a result.
#
# The sampling block sets `sampling_temperature: 0.7`, and a positive temperature
# makes the sampler draw by `w = n_pool ** (1 / 0.7) = n ** 1.43`, ignoring the
# per-source `weight:` entries entirely (data/sampler.py). So a 4x cap raise is a
# 7.2x raise in that source's draw weight, not just four times as many distinct
# items to sample from. The arm therefore mixes two changes: more distinct items,
# and a mixture shifted toward whichever sources were widened.
#
# Convenient for this experiment (the widened sources are benchmarks we want more
# of) but it is not a diversity-only control. A diversity-only control would need
# `sampling_temperature: 0`, which restores the `weight:` values and leaves the
# mixture fixed -- and then the baseline (49.11, run at 0.7) is no longer a
# matched comparison, so it needs its own run.
#
# Three choice sources are uncapped and carry most of the pool mass:
# arc (3,370 train), commonsenseqa (9,741), logiqa (7,376). Widening the other
# caps cannot move their share, so this arm's ceiling is set by them.
#
# A `max_train` above a source's train split is inert -- the cap never binds, so
# the in-memory shuffle never fires. Two of them were: banking77 (13,083 against
# 10,003 train) and piqa (17,951 against 16,113). Both now equal the split size.
#
# Compare against the frozen `last` baseline (49.11) at the same 5 epochs.
#
# Findings applied:
#   - Rank: r64 (head-size sweep — higher rank hurts for 0.6B)
#   - MLP: mlp=0 (MLP+LR targeted runs — MLP doesn't help for small backbone)
#   - LR: 1e-3 uniform (MTL optimization — baseline wins)
#   - Attention: SDPA auto-detect (PR #94)
#   - Data: 26 benchmarks + 154K synthetic (23 domains)
#   - Shared attention: TBD (pending #98 verification)
#
# Usage:
#   python model/scripts/train_multitask.py --config model/configs/r2_reranker0.6b_choicebalanced.yaml

model: Qwen/Qwen3-Reranker-0.6B
encoder: false
rank: 64
epochs: 20
lr: 0.001
accumulation_steps: 8
eval_every: 1
seed: 42
save_every_epoch: true
shared_attention: true

sources:
