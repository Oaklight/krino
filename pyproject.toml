[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krino"
dynamic = ["version"]
description = "Krino (κρίνω) — probing, analysis, and replication toolkit for JEV-class decision models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
data = [
    "pyarrow>=14.0",
]
train = [
    "accelerate>=0.30",
    "trl>=0.12",
]
serve = [
    "sglang[all]>=0.4",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.dynamic]
version = { attr = "krino.__version__" }

[tool.setuptools.packages.find]
include = ["krino*", "model*", "data*", "probing*"]

[tool.ruff]
exclude = ["probing/scripts/httpclient.py"]
